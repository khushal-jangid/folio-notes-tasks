<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="100%" stop-color="#2a201b"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f2ede4"/>
      <stop offset="100%" stop-color="#fdfbf7"/>
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1814" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Shadow & Notebook Cover -->
  <rect x="76" y="48" width="360" height="416" rx="28" fill="url(#coverGrad)" filter="url(#dropShadow)"/>
  
  <!-- Spine stitching detail -->
  <line x1="120" y1="48" x2="120" y2="464" stroke="#685447" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="76" y="48" width="44" height="416" rx="28" fill="#352922" opacity="0.5"/>
  
  <!-- Paper Pages Stack -->
  <rect x="130" y="66" width="290" height="380" rx="16" fill="url(#pageGrad)"/>
  <rect x="126" y="70" width="4" height="372" rx="2" fill="#e5dec9"/>
  
  <!-- Ribbon Bookmark -->
  <path d="M 330 66 L 330 200 L 345 180 L 360 200 L 360 66 Z" fill="url(#ribbonGrad)"/>
  
  <!-- Notebook Lines on Page -->
  <line x1="160" y1="130" x2="310" y2="130" stroke="#d4cbb8" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="170" x2="300" y2="170" stroke="#d4cbb8" stroke-width="4" stroke-linecap="round"/>
  <line x1="160" y1="210" x2="380" y2="210" stroke="#e0d8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="250" x2="380" y2="250" stroke="#e0d8c7" stroke-width="3" stroke-linecap="round"/>
  <line x1="160" y1="290" x2="380" y2="290" stroke="#e0d8c7" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Checkbox icon on line 1 -->
  <rect x="160" y="325" width="20" height="20" rx="6" fill="#10b981"/>
  <path d="M 165 335 L 169 339 L 176 331" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="195" y1="335" x2="360" y2="335" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Checkbox on line 2 -->
  <rect x="160" y="365" width="20" height="20" rx="6" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <line x1="195" y1="375" x2="340" y2="375" stroke="#4b5563" stroke-width="3" stroke-linecap="round"/>
</svg>
