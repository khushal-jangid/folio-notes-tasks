name: Build Pure Offline Standalone Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Native Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Prepare Offline Web Assets & Capacitor Bundle
        run: |
          mkdir -p www
          cp -r index.html css js icons manifest.json sw.js www/ || true
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android

      - name: 🔨 Compile Standalone APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 🚀 Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folio-Standalone-Offline-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
